[pytest]
# Run from the platform/ directory (where this file lives).
# Pytest adds platform/ to sys.path automatically via rootdir detection.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
# Suppress asyncio warnings at D0 (no async routes yet)
filterwarnings =
    ignore::DeprecationWarning
